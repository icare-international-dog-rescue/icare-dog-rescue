name: Build dog share pages

# Regenerates the per-dog preview pages in /d whenever the dog list changes.
# Keeps Facebook / link previews showing the right photo and name per dog.

on:
  push:
    branches: [main]
    paths:
      - 'dogs.json'
      - 'scripts/build-share-pages.js'
      - '.github/workflows/build-share-pages.yml'
  workflow_dispatch: {}

# Allow this workflow to commit the generated pages back to the repo.
permissions:
  contents: write

concurrency:
  group: build-share-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate per-dog share pages
        run: node scripts/build-share-pages.js

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A d
          if git diff --cached --quiet; then
            echo "Share pages already up to date — nothing to commit."
          else
            git commit -m "Update dog share preview pages [skip ci]"
            git push origin HEAD:main
          fi
