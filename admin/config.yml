# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: icare-international-dog-rescue/icare-dog-rescue   # change if your owner/repo differs
  branch: main

# Photos uploaded in the editor are saved into an "images" folder in the repo.
media_folder: "images"
public_folder: "images"

collections:
  - name: "content"
    label: "Website content"
    files:
      - name: "dogs"
        label: "Dogs"
        file: "dogs.json"
        format: "json"
        fields:
          - name: "dogs"
            label: "Dogs"
            label_singular: "Dog"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} — {{fields.status}}"
            hint: "Each dog is one entry. Click a dog to expand and edit it; drag to reorder. Use the button below to add a new dog."
            fields:
              - { name: "name", label: "Name", widget: "string", hint: "The dog's name as it should appear on the site." }
              - { name: "status", label: "Status", widget: "select", options: ["available", "healing", "rescued", "pending"], default: "available", hint: "available = ready to adopt · healing = still recovering · pending = adoption in progress · rescued = found a home" }
              - { name: "id", label: "Web link ID", widget: "string", pattern: ['^\S+$', 'No spaces — use a hyphen instead. Letters (any language), numbers and hyphens are fine.'], hint: "Used in this dog's web address (e.g. niik). Set it once when you create the dog and don't change it later, or the link will break." }
              - { name: "gender", label: "Gender", widget: "select", options: ["Female", "Male"], required: false }
              - { name: "age_value", label: "Age (number)", widget: "number", value_type: "int", min: 0, required: false, hint: "Just the number — e.g. 3. Pick the unit below." }
              - { name: "age_unit", label: "Age unit", widget: "select", options: ["years", "months"], default: "years", required: false }
              - { name: "age_approx", label: "Approximate age?", widget: "boolean", default: false, required: false, hint: "Turn on if the age is an estimate — shows as ~3 years." }
              - { name: "breed", label: "Breed / mix", widget: "string", required: false }
              - { name: "size", label: "Size", widget: "select", options: ["Small", "Medium", "Large"], required: false }
              - { name: "weight", label: "Weight", widget: "string", required: false, hint: "e.g. 8 kg" }
              - { name: "microchip", label: "Microchipped?", widget: "select", options: ["Yes", "No"], required: false }
              - name: "sterilized"
                label: "Sterilized"
                widget: "select"
                required: false
                options:
                  - { label: "Already sterilized", value: "Sterilized" }
                  - { label: "Will be sterilized before travel", value: "Waiting to be sterilized" }
              - { name: "locations", label: "Locations (tags)", widget: "list", required: false, collapsed: true, summary: "{{fields.place}}", field: { name: "place", label: "Place", widget: "string" }, hint: "Add each place on its own line. For rescued dogs: where they now live. For dogs still looking: where they can be adopted." }
              - { name: "since", label: "In our care since", widget: "datetime", type: "date", format: "YYYY-MM-DD", required: false, hint: "When this dog came into our care. Shown on the profile for dogs still looking for a home." }
              - { name: "arrived", label: "Arrived-home date", widget: "datetime", type: "date", format: "YYYY-MM-DD", required: false, hint: "Only for happy endings — the date the dog reached its new home. Shown once the status is set to 'rescued'." }
              - { name: "photo", label: "Cover photo", widget: "image", required: false, hint: "Main photo for the card and the top of the profile." }
              - { name: "photos", label: "More photos (gallery)", widget: "image", multiple: true, required: false, hint: "You can select several photos at once." }
              - { name: "video", label: "Video link (YouTube or .mp4 URL)", widget: "string", required: false }
              - { name: "video_file", label: "Or upload a short video clip", widget: "file", required: false, hint: "Keep clips under ~10 seconds and below 30 MB. For longer videos, paste a YouTube link above instead." }
              - { name: "desc", label: "Short line (shown on the card)", widget: "string", required: false, hint: "One sentence shown on the dog's card on the home page." }
              - { name: "story", label: "Full story (shown on the profile)", widget: "text", required: false }

  - name: "pages"
    label: "Website pages"
    files:
      - name: "how"
        label: "How we work"
        file: "how.json"
        format: "json"
        fields:
          - { name: "intro", label: "Intro paragraph", widget: "text" }
          - name: "steps"
            label: "Steps"
            label_singular: "Step"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Step title", widget: "string" }
              - { name: "body", label: "Step text", widget: "text" }
              - { name: "highlight", label: "Highlight this step (blue box)?", widget: "boolean", default: false }
          - name: "blocks"
            label: "Highlighted boxes"
            label_singular: "Box"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "eyebrow", label: "Small label above title", widget: "string", required: false }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "body", label: "Text", widget: "text" }
              - { name: "color", label: "Color", widget: "select", options: ["blue", "orange"], default: "blue" }
              - { name: "button_text", label: "Button text (optional)", widget: "string", required: false }
              - { name: "button_link", label: "Button link (optional)", widget: "string", required: false, hint: "e.g. mailto:icareinternationaldogrescue@gmail.com" }
      - name: "faq"
        label: "FAQ"
        file: "faq.json"
        format: "json"
        fields:
          - name: "faqs"
            label: "Questions"
            label_singular: "Question"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { name: "question", label: "Question", widget: "string" }
              - { name: "answer", label: "Answer", widget: "text" }
      - name: "stories"
        label: "Stories & updates"
        file: "stories.json"
        format: "json"
        fields:
          - name: "years"
            label: "Years"
            label_singular: "Year"
            widget: "list"
            collapsed: true
            summary: "{{fields.year}}"
            hint: "Each year is a milestone on the timeline. Add a year, then add its video clips inside it. The newest year shows first automatically."
            fields:
              - { name: "year", label: "Year", widget: "number", value_type: "int", hint: "e.g. 2025" }
              - { name: "summary", label: "Summary line (optional)", widget: "string", required: false, hint: "Shown next to the year, e.g. 240 dogs home · 6 countries. Leave blank to show just the year." }
              - name: "clips"
                label: "Clips"
                label_singular: "Clip"
                widget: "list"
                collapsed: true
                summary: "{{fields.title}}"
                hint: "Each clip is one Instagram Reel. Drag to reorder within the year."
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "blurb", label: "Short line (optional)", widget: "string", required: false }
                  - { name: "video", label: "Instagram Reel link", widget: "string", hint: "Paste the public Reel URL, e.g. https://www.instagram.com/reel/XXXXXXXXX/ — the Reel must stay public to show here." }
