<html lang="en">

<title>Dog profile — iCARE International Dog Rescue</title>
<meta name="description" content="Read this dog's story, see photos and video, and apply to adopt. iCARE rescues dogs and finds them safe, loving homes.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="iCARE International Dog Rescue">
<meta property="og:title" content="Meet our rescue dogs · iCARE International Dog Rescue">
<meta property="og:description" content="Read this dog's story, see photos and video, and apply to adopt.">
<meta property="og:url" content="https://icare-international-dog-rescue.github.io/icare-dog-rescue/dog.html">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#065EA5; --blue-dark:#054C84; --blue-light:#0A78C8;
    --orange:#DB5B33; --orange-dark:#C2461F; --orange-soft:#FCEDE7;
    --green:#3B7D4F;
    --ink:#16243A; --ink-soft:#5C6B7E;
    --paper:#FFFFFF; --panel:#F4F8FC; --line:#E2EAF2;
    --shadow:0 1px 2px rgba(6,94,165,.06), 0 14px 32px -18px rgba(6,46,90,.4);
    --r:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Inter",system-ui,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Montserrat",sans-serif; line-height:1.1; letter-spacing:-.01em; margin:0}
  .wrap{max-width:1080px; margin:0 auto; padding:0 clamp(18px,4vw,22px)}
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--blue)}

  header{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  .bar{max-width:1080px; margin:0 auto; padding:0 clamp(18px,4vw,22px); display:flex; align-items:center; justify-content:space-between; height:70px; position:relative}
  .brand img{height:50px; display:block}
  .menu-btn{display:none; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 13px; font:inherit; font-weight:600; font-size:14px; color:var(--ink); cursor:pointer}
  .nav-links{display:flex; align-items:center; gap:22px}
  .nav-links a.link{font-size:14px; font-weight:600; color:var(--ink-soft); text-decoration:none}
  .nav-links a.link:hover{color:var(--blue)}
  @media(max-width:720px){
    .brand img{height:42px}
    .menu-btn{display:block}
    .nav-links{position:absolute; top:100%; left:0; right:0; flex-direction:column; align-items:stretch; gap:0; background:#fff; border-bottom:1px solid var(--line); padding:6px clamp(18px,4vw,22px) 14px; display:none; box-shadow:0 16px 28px -18px rgba(0,0,0,.35)}
    .nav-links.open{display:flex}
    .nav-links a.link{padding:12px 0; border-bottom:1px solid var(--line)}
    .nav-links .navcta{margin-top:10px; text-align:center}
  }
  .loclabel{display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); margin-top:18px}
  .pins{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
  .pin{font-size:13px; font-weight:600; padding:5px 12px; border-radius:9px}
  .p-av{background:#E7F1FB; color:var(--blue-dark)}
  .p-res{background:#E5F1E9; color:var(--green)}
  .vol-callout{margin-top:30px; background:var(--orange-soft); border:1px solid #ECC6B6; border-radius:var(--r); padding:18px 20px}
  .vol-callout p{margin:0; font-size:14.5px; color:#5a3a2c}
  .vol-callout a{color:var(--orange-dark); font-weight:700; text-decoration:none}

  .profile-grid{display:grid; grid-template-columns:minmax(0,360px) 1fr; gap:34px; align-items:start; margin-top:26px}
  .media-col{position:sticky; top:90px; align-self:start}
  .info-col{min-width:0}
  .cover{position:relative; aspect-ratio:4/5; border-radius:var(--r); overflow:hidden; display:grid; place-items:center; background:#0c2236}
  .cover-img{width:100%; height:100%; object-fit:cover; object-position:center; cursor:zoom-in}
  .cover .ph-letter{font-family:"Montserrat"; font-weight:800; font-size:96px; color:rgba(255,255,255,.95)}
  @media(max-width:760px){
    .profile-grid{grid-template-columns:1fr; gap:20px}
    .media-col{position:static}
    .cover{aspect-ratio:4/3}
  }

  .head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px}
  .head h1{font-size:clamp(28px,4vw,40px); font-weight:800; line-height:1.05; margin-top:2px}
  .share-mini{display:flex; gap:6px; flex-shrink:0}
  .share-mini button{width:32px; height:32px; border-radius:50%; border:none; background:var(--panel); color:var(--ink-soft); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s}
  .share-mini button:hover{background:#E1EAF3; color:var(--blue)}
  .share-mini svg{display:block; width:16px; height:16px}
  .metadate{display:flex; align-items:center; gap:7px; margin-top:10px; color:var(--ink-soft); font-size:13.5px}
  .metadate .ml{font-weight:600}
  .metadate .dv{font-weight:600; color:var(--ink)}
  .specs{display:flex; flex-wrap:wrap; gap:16px 26px; margin-top:18px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .spec .sk{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#9aa7b3}
  .spec .sv{font-size:15px; font-weight:600; color:var(--ink); margin-top:2px}
  .tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
  .tag-ok{display:inline-flex; align-items:center; gap:4px; font-size:12.5px; color:var(--green); background:#EAF3E9; padding:5px 11px; border-radius:20px}
  .loc-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px}
  .loc-lab{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#9aa7b3}
  .tag-loc{font-size:12.5px; color:var(--blue-dark); background:#E6F1FB; padding:5px 11px; border-radius:20px}
  .story{font-size:16.5px; color:#2C3A4D; margin-top:20px; line-height:1.7}
  .story p{margin:0 0 14px} .story p:last-child{margin-bottom:0}
  .apply-cta{margin-top:22px}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; font-size:14px; font-weight:600; max-width:90%; text-align:center; box-shadow:0 14px 34px -10px rgba(0,0,0,.45); opacity:0; transition:.3s; z-index:200; pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .gallery{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:8px}
  .gallery img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; border:1px solid var(--line); cursor:zoom-in; transition:transform .15s}
  .gallery img:hover{transform:scale(1.02)}
  .lb{position:fixed; inset:0; background:rgba(8,16,26,.93); display:none; align-items:center; justify-content:center; z-index:100}
  .lb.open{display:flex}
  .lb-img{max-width:92vw; max-height:86vh; object-fit:contain; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb button{position:absolute; background:rgba(255,255,255,.16); color:#fff; border:0; cursor:pointer; border-radius:12px}
  .lb button:hover{background:rgba(255,255,255,.30)}
  .lb-close{top:16px; right:16px; width:44px; height:44px; font-size:24px}
  .lb-prev, .lb-next{top:50%; transform:translateY(-50%); width:48px; height:66px; font-size:30px}
  .lb-prev{left:14px} .lb-next{right:14px}
  .lb-count{bottom:18px; left:50%; transform:translateX(-50%); color:#fff; font-size:13px; background:rgba(255,255,255,.14); padding:5px 12px; border-radius:999px; pointer-events:none}
  .media-video{margin-top:8px; display:flex; justify-content:center}
  .media-video video{max-height:460px; max-width:100%; border-radius:10px; background:#000; display:block}
  .media-video .yt{width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden}
  .media-video .yt iframe{width:100%; height:100%; border:0; display:block}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-weight:700; font-size:14.5px; padding:12px 20px; border-radius:11px; border:1px solid transparent; cursor:pointer; transition:.15s; text-decoration:none}
  .btn-primary{background:var(--orange); color:#fff} .btn-primary:hover{background:var(--orange-dark)}
  .btn-ghost{background:#fff; border-color:var(--line); color:var(--blue)} .btn-ghost:hover{border-color:var(--blue)}
  .btn-block{width:100%}

  .apply{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:26px 26px 34px; margin:40px 0 60px}
  .apply #applyBtn{margin-top:8px}
  .apply h2{font-size:26px; font-weight:800}
  .apply .lead{color:var(--ink-soft); font-size:15px; margin:8px 0 20px}
  .fieldset{margin-bottom:18px}
  label.q{display:block; font-size:14px; font-weight:600; margin:0 0 7px}
  .req{color:var(--orange-dark)}
  input[type=text],input[type=email],input[type=tel],input[type=date],textarea,select{
    width:100%; font:inherit; font-size:14.5px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink)}
  textarea{resize:vertical; min-height:80px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue)}
  .opts{display:flex; flex-direction:column; gap:8px}
  .opt{display:flex; gap:9px; align-items:flex-start; font-size:14px; color:#33424f; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer}
  .opt input{margin-top:2px}
  .consent{margin-top:8px; padding-top:22px; border-top:2px solid var(--line)}
  .consent .ctitle{font-family:"Montserrat"; font-weight:800; font-size:15px; margin:0 0 12px; color:var(--ink)}
  .consent label.opt{font-weight:600; color:var(--ink); background:var(--orange-soft); border-color:#ECC6B6}
  .frow{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:560px){ .frow{grid-template-columns:1fr} }
  .ok{text-align:center; padding:30px 10px}
  .ok .tick{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
  footer{padding:24px 0 50px; text-align:center; color:var(--ink-soft); font-size:13px}
  footer a{color:var(--blue); text-decoration:none; font-weight:600}
  .notfound{text-align:center; padding:80px 20px; color:var(--ink-soft)}
  .reveal{opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); will-change:opacity,transform}
  .reveal.in{opacity:1; transform:none}
  #apply{scroll-margin-top:84px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important} .reveal{opacity:1; transform:none}}
</style>
</head>

  {id:'willow',name:'Willow',status:'rescued',age:'4 years',breed:'Labrador mix',size:'Large',since:'2025-11-12',photo:'',photos:[],video:'',story:"Willow waited a long time, but the right family came. She flew to Germany last winter and now spends her days on long forest walks."}
];

const STATUS_LABEL = {available:'Ready to adopt', healing:'Still healing', rescued:'Found a home', pending:'Pending'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toggleMenu(){ var n=document.getElementById('navlinks'); var b=document.querySelector('.menu-btn'); var open=n.classList.toggle('open'); if(b) b.setAttribute('aria-expanded', open); }
function resolveSrc(p){ if(!p) return ''; if(/^https?:\/\//i.test(p)) return p; return String(p).replace(/^\/+/, ''); }
function paras(t){ var s=String(t==null?'':t); var out=s.split(/\n{2,}/).map(function(p){ return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>'; }).join(''); return out||'<p></p>'; }
function fmtDate(s){ if(!s) return ''; var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return String(s); var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return parseInt(m[3],10)+' '+M[parseInt(m[2],10)-1]+' '+m[1]; }
function fmtAge(d){ if(d.age_value!==undefined && d.age_value!==null && String(d.age_value)!==''){ var v=parseInt(d.age_value,10); if(!isNaN(v)){ var unit=(d.age_unit==='months')?'months':'years'; var word=(v===1)?unit.replace(/s$/,''):unit; return (d.age_approx?'~':'')+v+' '+word; } } return d.age||''; }
var IC_FB='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7h2.34l.35-2.72H13.5V9.54c0-.79.22-1.32 1.35-1.32h1.44V5.78c-.25-.03-1.1-.11-2.1-.11-2.08 0-3.5 1.27-3.5 3.6v2.01H8.34V14h2.35v7z"/></svg>';
var IC_IG='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>';
var IC_LINK='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 14.5l5-5"/><path d="M11 6.5l1-1a3.5 3.5 0 0 1 5 5l-1.5 1.5"/><path d="M13 17.5l-1 1a3.5 3.5 0 0 1-5-5l1.5-1.5"/></svg>';
function copyText(t){ try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true; } }catch(e){} try{ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); return true; }catch(e){ return false; } }
function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.classList.add('show'); },10); setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },300); },3400); }
function shareName(){ return window.__shareName||'this dog'; }
function slugForId(id){ return encodeURIComponent(String(id==null?'':id)).replace(/%/g,'_').replace(/[^A-Za-z0-9_-]/g,'_'); }
function shareUrl(){ return window.__shareUrl || location.href; }
function shareFB(){ window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(shareUrl()),'_blank','noopener'); }
function shareIG(){ var url=shareUrl(), nm=shareName(); var cap='Meet '+nm+' 🐾 '+nm+' is looking for a loving home through iCARE International Dog Rescue. Could you help spread the word?\n'+url; if(navigator.share){ navigator.share({title:nm+' · iCARE International Dog Rescue', text:cap, url:url}).catch(function(){}); } else { copyText(cap); window.open('https://www.instagram.com/','_blank','noopener'); toast('Caption + link copied — paste it into your Instagram post or story.'); } }
function shareCopy(btn){ var ok=copyText(shareUrl()); var l=btn&&btn.querySelector?btn.querySelector('.cl'):null; if(l){ var o=l.textContent; l.textContent='Link copied!'; setTimeout(function(){ l.textContent=o; },1800); } else { toast(ok?'Link copied!':'Could not copy — please copy from the address bar.'); } }
function qid(){ const p=new URLSearchParams(location.search); return p.get('id'); }

function ytEmbed(url){
  const m = String(url).match(/(?:youtu\.be\/|v=)([\w-]{11})/);
  return m ? 'https://www.youtube.com/embed/'+m[1] : null;
}

async function load(){
  let dogs;
  try{ const r = await fetch('dogs.json',{cache:'no-store'}); if(!r.ok) throw 0; var data = await r.json(); dogs = Array.isArray(data) ? data : (data.dogs || []); }
  catch(e){ dogs = FALLBACK; }
  const id = qid();
  const dog = dogs.find(d => String(d.id||d.name)===String(id)) || dogs[0];
  render(dog);
}

function render(d){
  const main = document.getElementById('main');
  if(!d){ main.innerHTML = '<div class="notfound">Sorry, we couldn\'t find that dog. <a href="index.html">See all dogs</a>.</div>'; return; }
  const cphoto = resolveSrc(d.photo);
  const coverStyle = cphoto ? '' : `background:${GRADIENTS[0]}`;
  const coverInner = cphoto
    ? `<img class="cover-img lbimg" src="${esc(cphoto)}" alt="${esc(d.name)}">`
    : `<span class="ph-letter">${esc((d.name||'?')[0])}</span>`;
  const photos = Array.isArray(d.photos)? d.photos.filter(Boolean):[];
  const gallery = photos.length ? `<div class="gallery">${photos.map(p=>`<img class="lbimg" src="${esc(resolveSrc(p))}" alt="${esc(d.name)}">`).join('')}</div>` : '';
  let video = '';
  if(d.video_file){
    video = `<div class="media-video"><video src="${esc(resolveSrc(d.video_file))}" controls playsinline preload="metadata"></video></div>`;
  } else if(d.video){ const yt=ytEmbed(d.video);
    video = yt ? `<div class="media-video"><div class="yt"><iframe src="${yt}" allowfullscreen></iframe></div></div>`
               : `<div class="media-video"><video src="${esc(resolveSrc(d.video))}" controls playsinline preload="metadata"></video></div>`; }

  const isRescued = d.status==='rescued';
  const locs = Array.isArray(d.locations) ? d.locations.filter(Boolean) : [];

  function spec(k,v){ return v ? `<div class="spec"><div class="sk">${esc(k)}</div><div class="sv">${esc(v)}</div></div>` : ''; }
  const specHtml = [
    spec('Gender', d.gender),
    spec('Age', fmtAge(d)),
    spec('Weight', d.weight),
    spec('Breed', d.breed),
    spec('Size', d.size)
  ].join('');
  const specStrip = specHtml ? `<div class="specs">${specHtml}</div>` : '';

  const sterTag = (d.sterilized==='Sterilized')
    ? `<span class="tag-ok">✓ Sterilized</span>`
    : `<span class="tag-ok">✓ Sterilized before travel</span>`;
  const chipTag = (d.microchip==='Yes')
    ? `<span class="tag-ok">✓ Microchipped</span>`
    : `<span class="tag-ok">✓ Microchipped before flight</span>`;
  const tagsRow = `<div class="tags">${sterTag}${chipTag}</div>`;
  const locRow = locs.length
    ? `<div class="loc-row"><span class="loc-lab">${isRescued?'Now in':'Can be adopted to'}</span>${locs.map(x=>`<span class="tag-loc">${esc(x)}</span>`).join('')}</div>`
    : '';

  var dateLine = '';
  if(isRescued){
    if(d.arrived) dateLine = `<div class="metadate"><span>🏠</span><span class="ml">Arrived home</span><span class="dv">${esc(fmtDate(d.arrived))}</span></div>`;
  } else {
    if(d.since) dateLine = `<div class="metadate"><span>🐾</span><span class="ml">In our care since</span><span class="dv">${esc(fmtDate(d.since))}</span></div>`;
  }

  const shareMini = `<div class="share-mini">
        <button type="button" aria-label="Share on Facebook" onclick="shareFB()">${IC_FB}</button>
        <button type="button" aria-label="Share on Instagram" onclick="shareIG()">${IC_IG}</button>
        <button type="button" aria-label="Copy link" onclick="shareCopy(this)">${IC_LINK}</button>
      </div>`;
  const applyCta = isRescued ? '' : `<div class="apply-cta"><a class="btn btn-primary" href="#apply">Apply to adopt ${esc(d.name)}</a></div>`;

  const volBlock = `<div class="vol-callout"><p>✈️ Many of our dogs reach their new homes thanks to travelling volunteers. If you have a trip coming up, you could help a dog fly. <a href="how.html">Learn how it works →</a></p></div>`;
  const applyBlock = isRescued
    ? `<div class="apply"><h2>${esc(d.name)} found a home ♥</h2>
         <p class="lead">This is one of our happy endings. Want to help another dog find theirs?</p>
         <a class="btn btn-primary" href="index.html#dogs">See dogs still waiting</a></div>`
    : applyForm(d);

  main.innerHTML = `
    <div class="profile-grid">
      <div class="media-col">
        <div class="cover" style="${coverStyle}">${coverInner}</div>
        ${gallery}
        ${video}
      </div>
      <div class="info-col">
        <div class="head">
          <div>
            <div class="eyebrow">${isRescued?'Happy ending':'Looking for a home'}</div>
            <h1>${esc(d.name)}</h1>
            ${dateLine}
          </div>
          ${shareMini}
        </div>
        ${specStrip}
        ${tagsRow}
        ${locRow}
        <div class="story">${paras(d.story||d.desc||'')}</div>
        ${applyCta}
      </div>
    </div>
    ${volBlock}
    ${applyBlock}`;
  window.__shareName = d.name;
  window.__shareUrl = new URL('d/'+slugForId(d.id||d.name)+'.html', location.href).href;
  document.getElementById('yr').textContent = new Date().getFullYear();
  if(d && d.name){ document.title = d.name + ' · iCARE International Dog Rescue'; }
  revealObserve(Array.prototype.slice.call(main.children));
  buildLightbox();
  var nodes = main.querySelectorAll('.lbimg');
  LBIMGS = Array.prototype.map.call(nodes, function(n){ return n.getAttribute('src'); });
  Array.prototype.forEach.call(nodes, function(n, idx){ n.addEventListener('click', function(){ openLb(idx); }); });
}

function applyForm(d){
  return `
  <div class="apply" id="apply">
    <h2>Apply to adopt ${esc(d.name)}</h2>
    <p class="lead">Thank you for considering ${esc(d.name)}. Adoption is a lifelong commitment — please take your time. We read every application personally.</p>
    <form onsubmit="submitApp(event,'${esc(d.name)}')">
      <input type="hidden" name="dog" value="${esc(d.name)}">
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="frow">
        <div class="fieldset"><label class="q">Your name <span class="req">*</span></label><input type="text" name="name" required></div>
        <div class="fieldset"><label class="q">Email <span class="req">*</span></label><input type="email" name="email" required></div>
      </div>
      <div class="frow">
        <div class="fieldset"><label class="q">Phone <span class="req">*</span></label><input type="tel" name="phone" required></div>
        <div class="fieldset"><label class="q">When are you available to adopt this dog? <span class="req">*</span></label><input type="text" name="availability" placeholder="e.g. within a month" required></div>
      </div>
      <div class="frow">
        <div class="fieldset"><label class="q">Your age <span class="req">*</span></label><input type="text" name="age" required></div>
        <div class="fieldset"><label class="q">City you live in <span class="req">*</span></label><input type="text" name="city" required></div>
      </div>
      <div class="fieldset"><label class="q">Residency status <span class="req">*</span></label>
        <select name="residency" required><option value="">Choose…</option><option>Citizen</option><option>Permanent resident</option><option>Other lawful status</option><option>Prefer not to answer</option></select></div>
      <div class="fieldset"><label class="q">Occupation or source of income <span class="req">*</span></label><input type="text" name="occupation" required></div>
      <div class="fieldset"><label class="q">Why do you want to adopt a rescue dog? <span class="req">*</span></label><textarea name="why" required></textarea></div>
      <div class="fieldset"><label class="q">Do you have experience with rescue dogs? <span class="req">*</span></label><textarea name="experience" required></textarea></div>
      <div class="frow">
        <div class="fieldset"><label class="q">Housing status <span class="req">*</span></label>
          <select name="housing" required><option value="">Choose…</option><option>Owned</option><option>Rented</option><option>Other</option></select></div>
        <div class="fieldset"><label class="q">Type of home <span class="req">*</span></label>
          <select name="hometype" required><option value="">Choose…</option><option>Single family home</option><option>Condo / apartment</option><option>Duplex</option><option>Other</option></select></div>
      </div>
      <div class="fieldset"><label class="q">Who lives in your home — ages and relationship to you <span class="req">*</span></label><textarea name="household" required></textarea></div>
      <div class="fieldset"><label class="q">Are all household residents aware of and supportive of this adoption? <span class="req">*</span></label>
        <select name="support" required><option value="">Choose…</option><option>Yes</option><option>No</option><option>We haven't discussed this yet</option></select></div>
      <div class="fieldset"><label class="q">Does anyone in the household have allergies or asthma? <span class="req">*</span></label>
        <select name="allergies" required><option value="">Choose…</option><option>Yes</option><option>No</option><option>Maybe</option></select></div>
      <div class="frow">
        <div class="fieldset"><label class="q">If you have other pets, are they vaccinated?</label>
          <select name="pets_vax"><option value="">N/A</option><option>Yes</option><option>No</option><option>Not sure</option></select></div>
        <div class="fieldset"><label class="q">If you have other pets, are they spayed/neutered?</label>
          <select name="pets_neutered"><option value="">N/A</option><option>Yes</option><option>No</option><option>Maybe</option><option>Not all</option></select></div>
      </div>
      <div class="fieldset"><label class="q">I am NOT willing to adopt a dog that… (select all that apply) <span class="req">*</span></label>
        <div class="opts">
          ${["is not fully housetrained","has not lived with young children","has not lived with cats or other animals","has no basic obedience training","is not crate trained","shows fearful behavior","has a history of abuse or neglect","has physical deformities or is missing limbs","has been used for breeding purposes","suffers from separation anxiety","I can accept all of the above","Other"]
            .map(o=>`<label class="opt"><input type="checkbox" name="not_willing" value="${esc(o)}">${esc(o)}</label>`).join('')}
        </div></div>
      <div class="consent">
        <p class="ctitle">Before you submit, please confirm <span class="req">*</span></p>
        <label class="opt"><input type="checkbox" name="ack_pets" required> I understand iCare will not place dogs in homes with unaltered, unvaccinated, or breeding pets.</label>

async function submitApp(e, name){
  e.preventDefault();
  const f = e.target;
  const btn = document.getElementById('applyBtn');
  if(FORM_ENDPOINT){
    btn.disabled=true; btn.textContent='Sending…';
    try{
      const fd = new FormData(f);
      fd.append('access_key', WEB3FORMS_KEY);
      fd.append('subject', 'New application to adopt ' + name);
      fd.append('from_name', 'iCARE Dog Rescue website');
      const res = await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Accept':'application/json'},body:fd});
      const data = await res.json().catch(function(){ return {}; });
      if(!res.ok || !data.success) throw 0;
    }catch(err){ btn.disabled=false; btn.textContent='Send application for '+name;
      alert('Something went wrong sending your application. Please try again, or email us directly at icareinternationaldogrescue@gmail.com.'); return; }
  }
  document.getElementById('apply').innerHTML = `
    <div class="ok"><div class="tick">✓</div>
      <h2 style="font-size:24px">Thank you!</h2>
      <p style="color:var(--ink-soft); max-width:40ch; margin:10px auto 0">
        Your application to adopt ${esc(name)} has been received. We'll be in touch soon.</p></div>`;
}

function revealObserve(els){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ els.forEach(function(e){e.classList.add('in');}); return; }
  var io=new IntersectionObserver(function(ents){ents.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target);} });},{threshold:.1, rootMargin:'0px 0px -6% 0px'});
  els.forEach(function(e,i){ e.classList.add('reveal'); e.style.transitionDelay=(Math.min(i,6)*45)+'ms'; io.observe(e); });
}
var LBIMGS=[], lbi=0;
function buildLightbox(){
  if(document.getElementById('lb')) return;
  var lb=document.createElement('div'); lb.id='lb'; lb.className='lb';
  lb.innerHTML='<button class="lb-close" aria-label="Close">\u00d7</button><button class="lb-prev" aria-label="Previous">\u2039</button><img class="lb-img" alt=""><button class="lb-next" aria-label="Next">\u203a</button><div class="lb-count"></div>';
  document.body.appendChild(lb);
  lb.querySelector('.lb-close').addEventListener('click', closeLb);
  lb.querySelector('.lb-prev').addEventListener('click', function(e){ e.stopPropagation(); stepLb(-1); });
  lb.querySelector('.lb-next').addEventListener('click', function(e){ e.stopPropagation(); stepLb(1); });
  lb.addEventListener('click', function(e){ if(e.target===lb) closeLb(); });
}
function openLb(i){ if(!LBIMGS.length) return; lbi=(i+LBIMGS.length)%LBIMGS.length; showLb(); document.getElementById('lb').classList.add('open'); document.body.style.overflow='hidden'; }
function closeLb(){ var lb=document.getElementById('lb'); if(lb) lb.classList.remove('open'); document.body.style.overflow=''; }
function stepLb(d){ lbi=(lbi+d+LBIMGS.length)%LBIMGS.length; showLb(); }
function showLb(){ var lb=document.getElementById('lb'); lb.querySelector('.lb-img').src=LBIMGS[lbi]; lb.querySelector('.lb-count').textContent=(lbi+1)+' / '+LBIMGS.length; var m=LBIMGS.length>1?'':'none'; lb.querySelector('.lb-prev').style.display=m; lb.querySelector('.lb-next').style.display=m; lb.querySelector('.lb-count').style.display=m; }
document.addEventListener('keydown', function(e){ var lb=document.getElementById('lb'); if(!lb||!lb.classList.contains('open')) return; if(e.key==='Escape') closeLb(); else if(e.key==='ArrowLeft') stepLb(-1); else if(e.key==='ArrowRight') stepLb(1); });
load();
</script>
